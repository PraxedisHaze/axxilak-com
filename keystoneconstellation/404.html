<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Keystone Constellation</title>
  <meta name="description" content="The page you requested could not be found. Return to Keystone Constellation home.">
  <meta name="robots" content="noindex,follow">
  <style>
    :root {
      --bg: #050505;
      --gold: #d4af37;
      --text: #f3f3f3;
      --muted: #a1a1aa;
      --panel: rgba(212, 175, 55, 0.08);
      --border: rgba(212, 175, 55, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #171717 0%, var(--bg) 45%, #000 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(680px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    a {
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    a.primary {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: 600;
    }
    a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Page Not Found (404)</h1>
    <p>
      The page you requested is not currently available. You can return home, browse available tools,
      or contact Keystone Constellation directly.
    </p>
    <div class="actions">
      <a class="primary" href="/">Return Home</a>
      <a href="/free-stuff.html">Browse Free Tools</a>
      <a href="mailto:t.drake@keystoneconstellation.com">Contact Support</a>
    </div>
  </main>
</body>
</html>
