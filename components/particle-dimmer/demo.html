<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Dimmer Demo</title><link rel="stylesheet" href="particle-dimmer.css"><style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:#030807;color:#eafffa;font:16px/1.5 system-ui,sans-serif}.demo{width:min(90vw,680px);padding:30px;border:1px solid rgba(68,255,170,.25);border-radius:24px;background:rgba(5,20,18,.82)}h1{font-size:clamp(2.4rem,7vw,4.8rem);line-height:.95;margin:0 0 16px;color:#00e6e6}.demo p{color:#aec7c2}.particle-dimmer{margin-top:26px}</style></head><body><canvas id="particle-field" class="particle-field" aria-hidden="true"></canvas><main class="demo"><h1>Particle<br>Dimmer</h1><p>A small plug-and-play fader for your website background.</p><div class="particle-dimmer"><div class="particle-dimmer__row"><label for="particle-dimmer">Dim the background</label><output id="particle-dimmer-value" for="particle-dimmer">Blast</output></div><input type="range" id="particle-dimmer" min="0" max="100" value="100" aria-label="Background particle intensity"></div></main><script src="particle-dimmer.js"></script></body></html>
