  <text x="86" y="365" fill="#fdf6ff" font-family="Georgia, serif" font-size="72" font-weight="700">Instruments,</text>
  <text x="86" y="445" fill="#ff6bc1" font-family="Georgia, serif" font-size="72" font-style="italic" font-weight="700">not accounts.</text>
  <text x="86" y="523" fill="#cbb8de" font-family="Inter, sans-serif" font-size="24">An app store and custom app design studio for useful tools you can own.</text>
