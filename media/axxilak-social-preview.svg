<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Axxilak Studios - Instruments, not accounts</title>
  <desc id="desc">An app store and custom app design studio for useful tools you can own.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0710"/><stop offset=".55" stop-color="#150c22"/><stop offset="1" stop-color="#26102f"/></linearGradient>
    <radialGradient id="pink"><stop stop-color="#ff2e9a" stop-opacity=".55"/><stop offset="1" stop-color="#ff2e9a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop stop-color="#00e5ff" stop-opacity=".35"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="130" cy="100" r="290" fill="url(#pink)"/>
